<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flag Practice</title>
        <style>
            .flag{
                width: 900px;
                height: 600px;
                background-color: red;
                position: relative;
            }
            p{
                text-align: center;
                font-size: 30px;
                color: white;
                padding-top : 20px;
            }
            .flag div{
                width: 900px;
                height: 300px;
                background-color: blue;
                align-items: center;
                position: absolute;
                top: 125px;
            }
            .flag >div div{
                width: 200px;
                height: 200px;
                background-color: white;
                border-radius: 50%;
                position: relative;
                top: 50px;
                left: 350px;
            }
        </style>
    </head>
    <body>
        <div class="flag">
            <p> the flag of Laos</p>
            <div>
                <div>

                </div>
            </div>
        </div>

    </body>
</html>
